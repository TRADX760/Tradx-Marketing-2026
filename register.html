<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | TRADX</title>
  <link rel="stylesheet" href="CSS/style.css?v=3">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">TRADX<span>.</span></a>

  <nav>
    <a href="index.html">Home</a>
    <a href="trading-tools.html">Trading Tools</a>
    <a href="dashboard.html">Admin Dashboard</a>
  </nav>

  <div class="nav-buttons">
    <a href="login.html" class="login-btn">Login</a>
    <a href="register.html" class="signup-btn">Get Started</a>
  </div>
</header>

<main class="auth-container">
  <div class="auth-card">
    <div class="badge">• CREATE AN ACCOUNT</div>
    <h1>Start Trading Today</h1>
    <p>Get full access to TRADX tools, AI signals, and portfolio analytics.</p>

    <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" class="form-input" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="email" id="reg-email" class="form-input" placeholder="trader@tradx.com" required>
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-auth">Create Account & Enter →</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>
</main>

</body>
</html>
