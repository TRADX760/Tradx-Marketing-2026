<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradX — Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #080b0f;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #141b23;
      border: 1px solid #273445;
      border-radius: 18px;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8b9bb0;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #c5d0dc;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #2a3745;
      background: #0f141a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #00e08f;
      color: #06110c;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #8b9bb0;
    }

    a {
      color: #3b82f6;
      text-decoration: none;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #00e08f;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>TradX</h1>

    <p class="subtitle">Create your trading account</p>

    <form id="registerForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        required
      >

      <button type="submit">Create Account</button>

      <p id="message"></p>

    </form>

    <p class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </p>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");

      if (password !== confirmPassword) {
        message.style.color = "#ff4d6d";
        message.textContent = "Passwords do not match.";
        return;
      }

      localStorage.setItem("tradxUser", JSON.stringify({
        name: name,
        email: email,
        password: password
      }));

      message.style.color = "#00e08f";
      message.textContent = "Account created successfully!";

      setTimeout(() => {
        window.location.href = "login.html";
      }, 1000);
    });
  </script>

</body>
  </html>
