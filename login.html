<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | TRADX</title>
  <link rel="stylesheet" href="CSS/style.css?v=3">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">TRADX<span>.</span></a>

  <nav>
    <a href="index.html">Home</a>
    <a href="trading-tools.html">Trading Tools</a>
    <a href="dashboard.html">Admin Dashboard</a>
  </nav>

  <div class="nav-buttons">
    <a href="login.html" class="login-btn">Login</a>
    <a href="register.html" class="signup-btn">Get Started</a>
  </div>
</header>

<main class="auth-container">
  <div class="auth-card">
    <div class="badge">• TRADX AUTHENTICATION</div>
    <h1>Welcome Back</h1>
    <p>Sign in to access your admin trading dashboard & AI market analyst.</p>

    <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="admin@tradx.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>

      <div class="form-row">
        <label class="remember-me">
          <input type="checkbox" checked> Remember me
        </label>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-auth">Sign In to Dashboard →</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Get Started</a>
    </div>
  </div>
</main>

</body>
          </html>
