<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradX - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #080b0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #11161d;
      padding: 35px 25px;
      border-radius: 16px;
      border: 1px solid #252d38;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #20d6a3;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9aa4b2;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      background: #080b0f;
      border: 1px solid #303946;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #20d6a3;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #20d6a3;
      color: #07100d;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .register {
      text-align: center;
      margin-top: 25px;
      color: #9aa4b2;
    }

    .register a {
      color: #20d6a3;
      text-decoration: none;
      font-weight: bold;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #9aa4b2;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">TradX</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">Login to your TradX account</p>

    <form onsubmit="loginUser(event)">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">Login</button>

    </form>

    <p class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </p>

    <a class="home" href="index.html">← Back to Home</a>

  </div>

  <script>
    function loginUser(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (email && password) {
        alert("Login form submitted successfully.");
      }
    }
  </script>

</body>
  </html>
